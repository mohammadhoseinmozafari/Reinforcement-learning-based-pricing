scheduler:
  window_size: 20
  change_threshold: 0.04
  monitor_critic: true
  monitor_actor: true
  monitor_alpha: false
  min_episodes_per_stage: 100
  max_episodes_per_stage: 250

# Legacy sequential curriculum. The universal protocol uses universal_mixed.yaml
# and samples its pool per episode instead of advancing through these stages.
stages:
  - name: fixed_uniform
    opponent_type: uniform_fixed
    difficulty: tutorial
    description: "Episode-fixed randomized uniform price"
  - name: fixed_bbp
    opponent_type: bbp_fixed_discriminator
    difficulty: easy
    description: "Episode-fixed randomized BBP discriminator"
  - name: random_uniform
    opponent_type: uniform_random
    difficulty: easy
    description: "Noisy randomized uniform price"
  - name: acquisition_bbp
    opponent_type: bbp_acquisition_predator
    difficulty: medium
    description: "Aggressive BBP new-customer acquisition"
  - name: undercutter_uniform
    opponent_type: uniform_undercutter
    difficulty: medium
    description: "Delayed uniform-price undercutting response"
  - name: loyalty_bbp
    opponent_type: bbp_loyalty_harvester
    difficulty: hard
    description: "BBP policy harvesting established-customer loyalty"
  - name: tit_for_tat_uniform
    opponent_type: uniform_tit_for_tat
    difficulty: hard
    description: "Cooperative uniform pricing with finite retaliation"
  - name: myopic_bbp
    opponent_type: bbp_myopic_segment_optimizer
    difficulty: expert
    description: "Myopic segmented BBP grid optimizer"
  - name: myopic_uniform
    opponent_type: uniform_myopic
    difficulty: expert
    description: "Analytical one-period uniform best response"
