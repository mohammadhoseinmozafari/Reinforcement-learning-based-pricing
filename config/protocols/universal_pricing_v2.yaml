protocol_version: universal_pricing_v2
action_contract_version: pricing_action_v1
observation_contract_version: hierarchical_pricing_observation_v2
curriculum_id: hierarchical_full_curriculum
reward_specification: normalized_net_profit
market_timing: simultaneous
artifact_root: experiments/upv2
regime_commitment_length: 10
bbp_operating_cost_rate: 0.01

opponent_pool_config: ../universal_pricing_v2/opponent_pool.yaml
# V2 intentionally reuses the frozen v1 numerical seed banks.
seed_manifest: ../seeds/universal_pricing_v1.yaml

mastery_gate:
  validation_interval_steps: 5000
  score_threshold: 0.0
  consecutive_passes: 2
  validation_seed_count: 5
  strategy_uniform_accuracy: 0.80
  strategy_bbp_accuracy: 0.80

training_budget:
  uniform_pricing_steps: 60000
  bbp_pricing_steps: 60000
  strategy_total_steps: 200000
  strategy_frozen_minimum_steps: 50000
  strategy_frozen_maximum_steps: 100000
  warmup_steps: 1000
  updates_per_step: 1
  checkpoint_interval_steps: 10000
  evaluation_interval_steps: 10000

curricula:
  uniform_pricing:
    - {name: Uniform Fixed, opponent_policy_name: uniform_fixed, minimum_steps: 5000, maximum_steps: 30000}
    - {name: BBP Fixed Discriminator, opponent_policy_name: bbp_fixed_discriminator, minimum_steps: 5000, maximum_steps: 30000}
  bbp_pricing:
    - {name: Uniform Fixed, opponent_policy_name: uniform_fixed, minimum_steps: 6000, maximum_steps: 30000}
    - {name: BBP Fixed Discriminator, opponent_policy_name: bbp_fixed_discriminator, minimum_steps: 6000, maximum_steps: 30000}

agent_profiles:
  sac:
    architecture: sac
    pricing_hidden_dimensions: [128, 128]
    strategy_hidden_dimensions: [128, 128]
    actor_learning_rate: 0.0005
    critic_learning_rate: 0.0005
    entropy_learning_rate: 0.0003
    joint_price_learning_rate: 0.00003
    gamma_price: 0.99
    gamma_strategy: 0.9043820750088044
    tau: 0.005
    initial_temperature: 0.6
    gradient_clip_norm: 10.0
    batch_size: 256
    pricing_replay_capacity: 300000
    strategy_replay_capacity: 100000
  rsac:
    architecture: rsac
    pricing_hidden_dimensions: [128]
    strategy_hidden_dimensions: [128]
    recurrent_hidden_dimension: 128
    price_sequence_length: 16
    price_burn_in_length: 16
    strategy_sequence_length: 8
    strategy_burn_in_length: 2
    episode_replay_capacity: 1000
    actor_learning_rate: 0.0005
    critic_learning_rate: 0.0005
    entropy_learning_rate: 0.0003
    joint_price_learning_rate: 0.00003
    gamma_price: 0.99
    gamma_strategy: 0.9043820750088044
    tau: 0.005
    initial_temperature: 0.6
    gradient_clip_norm: 10.0
    batch_size: 64
    pricing_replay_capacity: 300000
    strategy_replay_capacity: 100000
  oe_rsac:
    architecture: oe_rsac
    pricing_hidden_dimensions: [128]
    strategy_hidden_dimensions: [128]
    recurrent_hidden_dimension: 128
    price_sequence_length: 16
    price_burn_in_length: 16
    strategy_sequence_length: 8
    strategy_burn_in_length: 2
    episode_replay_capacity: 1000
    opponent_embedding_dimension: 32
    encoder_hidden_dimension: 128
    encoder_learning_rate: 0.0005
    auxiliary_loss_weight: 1.0
    actor_learning_rate: 0.0003
    critic_learning_rate: 0.0003
    entropy_learning_rate: 0.0001
    joint_price_learning_rate: 0.00003
    gamma_price: 0.99
    gamma_strategy: 0.9043820750088044
    tau: 0.005
    initial_temperature: 0.2
    gradient_clip_norm: 1000.0
    batch_size: 64
    pricing_replay_capacity: 300000
    strategy_replay_capacity: 100000

consumer_distributions:
  location:
    uniform: {low: 0.0, high: 1.0}
    truncated_normal: {mean: 0.5, standard_deviation: 0.2, low: 0.0, high: 1.0}
    truncated_skew_normal: {location: 0.2457160185, scale: 0.3497947666, shape: 5.0, low: 0.0, high: 1.0}
  strategicness:
    uniform: {low: 0.0, high: 1.0}
    truncated_normal: {mean: 0.5, standard_deviation: 0.2, low: 0.0, high: 1.0}
    truncated_skew_normal: {location: 0.2457160185, scale: 0.3497947666, shape: 5.0, low: 0.0, high: 1.0}
  exclusivity:
    uniform: {low: 0.0, high: 1.0}
    truncated_normal: {mean: 0.5, standard_deviation: 0.2, low: 0.0, high: 1.0}
    truncated_skew_normal: {location: 0.2457160185, scale: 0.3497947666, shape: 5.0, low: 0.0, high: 1.0}
